<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#0B101D"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <linearGradient id="videoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="accentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1440" height="900" fill="url(#bgGrad)"/>

  <!-- Top Global Header / Navigation -->
  <g id="TopBar" transform="translate(0, 0)">
    <!-- Brand / Logo -->
    <g transform="translate(32, 28)">
      <polygon points="0,4 16,14 0,24" fill="#38BDF8" filter="url(#accentGlow)"/>
      <text x="28" y="19" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" letter-spacing="1">SHORTLEARN</text>
    </g>

    <text x="310" y="47" fill="#64748B" font-family="sans-serif" font-size="13">Nền tảng học tiếng Anh qua Video ngắn</text>

    <!-- Top Right Actions -->
    <g transform="translate(1360, 26)">
      <circle cx="20" cy="20" r="18" fill="#1E293B" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="20" y="26" fill="#94A3B8" font-family="sans-serif" font-size="16" text-anchor="middle">⚙</text>
    </g>
  </g>

  <!-- Left Sidebar -->
  <g id="Sidebar" transform="translate(32, 100)">
    <!-- Active Nav: Shorts -->
    <rect x="0" y="0" width="200" height="48" rx="12" fill="#1E293B" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <text x="20" y="30" font-size="18">🎬</text>
    <text x="52" y="30" fill="#38BDF8" font-family="sans-serif" font-size="14" font-weight="700">Shorts</text>

    <!-- Nav Item: Đã lưu -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="200" height="48" rx="12" fill="transparent"/>
      <text x="20" y="30" font-size="18">🔖</text>
      <text x="52" y="30" fill="#94A3B8" font-family="sans-serif" font-size="14" font-weight="600">Đã lưu</text>
      <circle cx="176" cy="24" r="8" fill="#EF4444"/>
      <text x="176" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">1</text>
    </g>

    <!-- Nav Item: Tài khoản -->
    <g transform="translate(0, 112)">
      <rect x="0" y="0" width="200" height="48" rx="12" fill="transparent"/>
      <text x="20" y="30" font-size="18">👤</text>
      <text x="52" y="30" fill="#94A3B8" font-family="sans-serif" font-size="14" font-weight="600">Tài khoản</text>
    </g>

    <!-- User Mini Profile -->
    <g transform="translate(0, 700)">
      <circle cx="20" cy="20" r="18" fill="#2563EB"/>
      <text x="20" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">H</text>
      <text x="48" y="18" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="700">HP Victus</text>
      <text x="48" y="34" fill="#64748B" font-family="sans-serif" font-size="11">Free Learner</text>
    </g>
  </g>

  <!-- Center Content: Android Mobile Device Preview (Shorts Player) -->
  <g id="MobileFrame" transform="translate(260, 100)" filter="url(#cardShadow)">
    <!-- Device Body -->
    <rect width="360" height="740" rx="32" fill="#000000" stroke="#334155" stroke-width="4"/>

    <!-- Screen Viewport -->
    <g clip-path="url(#phoneClip)">
      <rect width="360" height="740" rx="28" fill="url(#videoGrad)"/>

      <!-- Video Placeholder Scene -->
      <circle cx="180" cy="240" r="70" fill="#38BDF8" fill-opacity="0.1"/>
      <polygon points="170,215 205,240 170,265" fill="#38BDF8"/>

      <!-- Video Metadata inside Mobile Screen -->
      <g transform="translate(18, 450)">
        <text x="0" y="0" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">@c7hexa.footyx</text>
        <text x="0" y="20" fill="#CBD5E1" font-family="sans-serif" font-size="12">Neymar &amp; Yamal Silenced the Crowd! ⚽</text>
      </g>

      <!-- Language Reactor Dock on Phone -->
      <g transform="translate(0, 520)">
        <rect width="360" height="220" fill="#0B101D" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>

        <!-- Word Chips -->
        <g transform="translate(14, 16)">
          <rect x="0" y="0" width="54" height="30" rx="6" fill="#1E293B"/>
          <text x="27" y="20" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">This</text>

          <rect x="60" y="0" width="46" height="30" rx="6" fill="#1E293B"/>
          <text x="83" y="20" fill="#4ADE80" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">is</text>

          <rect x="112" y="0" width="52" height="30" rx="6" fill="#1E293B"/>
          <text x="138" y="20" fill="#FBBF24" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">fast</text>

          <rect x="170" y="0" width="48" height="30" rx="6" fill="#1E293B"/>
          <text x="194" y="20" fill="#F43F5E" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">and</text>

          <rect x="224" y="0" width="76" height="30" rx="6" fill="#1E293B"/>
          <text x="262" y="20" fill="#A855F7" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">accurate</text>
        </g>

        <!-- Translation -->
        <text x="16" y="80" fill="#94A3B8" font-family="sans-serif" font-size="13">Nhanh chóng và chuẩn xác này</text>

        <!-- Mini Controls -->
        <g transform="translate(14, 110)">
          <rect x="0" y="0" width="72" height="28" rx="6" fill="#1E293B"/>
          <text x="36" y="18" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">↺ Lại câu</text>

          <rect x="80" y="0" width="76" height="28" rx="6" fill="#1E293B"/>
          <text x="118" y="18" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">⏸ Pause</text>

          <rect x="164" y="0" width="72" height="28" rx="6" fill="#1E293B"/>
          <text x="200" y="18" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Tiếp ❯</text>

          <rect x="244" y="0" width="72" height="28" rx="6" fill="rgba(56, 189, 248, 0.15)"/>
          <text x="280" y="18" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Short ❯❯</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Right Side: Learning Dashboard & Subtitle Analysis (As seen in Figma Make) -->
  <g id="RightDashboard" transform="translate(660, 100)">
    <!-- Hero Header -->
    <text x="0" y="20" fill="#F97316" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">LEARNING REACTOR 2.0</text>
    <text x="0" y="58" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800">Một video ngắn.</text>
    <text x="0" y="98" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800">Một điều mới.</text>
    <text x="0" y="128" fill="#94A3B8" font-family="sans-serif" font-size="14">Học từ vựng trong ngữ cảnh thực tế qua YouTube Shorts với phụ đề song ngữ AI và SRS Flashcard.</text>

    <!-- Interactive Subtitle Card -->
    <g transform="translate(0, 160)" filter="url(#cardShadow)">
      <rect width="720" height="190" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

      <!-- Primary English Sentence with Interactive Words -->
      <g transform="translate(28, 44)">
        <text font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800">
          <tspan fill="#A855F7">This </tspan>
          <tspan fill="#38BDF8">is </tspan>
          <tspan fill="#FBBF24">fast </tspan>
          <tspan fill="#F43F5E">and </tspan>
          <tspan fill="#4ADE80">accurate</tspan>
        </text>
      </g>

      <!-- Vietnamese Meaning -->
      <text x="28" y="98" fill="#E2E8F0" font-family="sans-serif" font-size="16" font-weight="500">Điều này thật nhanh chóng và chuẩn xác</text>
      <text x="28" y="126" fill="#64748B" font-family="sans-serif" font-size="13">Ngữ cảnh: Bình luận thể thao &amp; phản xạ nhanh</text>

      <!-- Action Buttons Row -->
      <g transform="translate(28, 142)">
        <rect x="0" y="0" width="88" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="44" y="22" fill="#CBD5E1" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">↺ Lại câu</text>

        <rect x="98" y="0" width="88" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="142" y="22" fill="#CBD5E1" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">⏸ Pause</text>

        <rect x="196" y="0" width="88" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="240" y="22" fill="#CBD5E1" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Tiếp theo ❯</text>

        <rect x="580" y="0" width="112" height="34" rx="8" fill="#2563EB"/>
        <text x="636" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">⭐ Lưu từ vựng</text>
      </g>
    </g>

    <!-- Subtitle Timeline List -->
    <g transform="translate(0, 375)">
      <text x="0" y="0" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="1">DÒNG THỜI GIAN PHỤ ĐỀ (TIMELINE)</text>

      <!-- Timeline Item 1 (Active) -->
      <g transform="translate(0, 16)">
        <rect width="720" height="52" rx="10" fill="#151E2E" stroke="#38BDF8" stroke-width="1.2"/>
        <rect x="14" y="14" width="52" height="24" rx="6" fill="#0B132B"/>
        <text x="40" y="30" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">00:00</text>
        <text x="78" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">This is fast and accurate</text>
        <text x="420" y="32" fill="#94A3B8" font-family="sans-serif" font-size="12">Điều này thật nhanh chóng và chuẩn xác</text>
        <polygon points="690,26 698,21 690,16" fill="#38BDF8"/>
      </g>

      <!-- Timeline Item 2 -->
      <g transform="translate(0, 76)">
        <rect width="720" height="52" rx="10" fill="#111827" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <rect x="14" y="14" width="52" height="24" rx="6" fill="#0B132B"/>
        <text x="40" y="30" fill="#64748B" font-family="monospace" font-size="11" text-anchor="middle">00:05</text>
        <text x="78" y="32" fill="#CBD5E1" font-family="sans-serif" font-size="13">Check out that drive</text>
        <text x="420" y="32" fill="#64748B" font-family="sans-serif" font-size="12">Hãy nhìn cú lái xe đó</text>
      </g>

      <!-- Timeline Item 3 -->
      <g transform="translate(0, 136)">
        <rect width="720" height="52" rx="10" fill="#111827" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <rect x="14" y="14" width="52" height="24" rx="6" fill="#0B132B"/>
        <text x="40" y="30" fill="#64748B" font-family="monospace" font-size="11" text-anchor="middle">00:12</text>
        <text x="78" y="32" fill="#CBD5E1" font-family="sans-serif" font-size="13">They silenced the entire crowd</text>
        <text x="420" y="32" fill="#64748B" font-family="sans-serif" font-size="12">Họ đã làm câm lặng toàn bộ đám đông</text>
      </g>
    </g>

    <!-- Bottom Metrics (Matches Figma Make) -->
    <g transform="translate(0, 595)">
      <!-- Metric 1: Words Learned -->
      <g transform="translate(0, 0)">
        <text x="0" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="900">35</text>
        <text x="0" y="54" fill="#94A3B8" font-family="sans-serif" font-size="13">Từ mới đã lưu</text>
      </g>

      <!-- Metric 2: Streak Days -->
      <g transform="translate(140, 0)">
        <text x="0" y="32" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="900">01</text>
        <text x="0" y="54" fill="#94A3B8" font-family="sans-serif" font-size="13">Chuỗi ngày học (Streak)</text>
      </g>

      <!-- Metric 3: FSRS Retention -->
      <g transform="translate(300, 0)">
        <text x="0" y="32" fill="#4ADE80" font-family="'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="900">92%</text>
        <text x="0" y="54" fill="#94A3B8" font-family="sans-serif" font-size="13">Độ ghi nhớ FSRS</text>
      </g>

      <!-- View Details Link -->
      <text x="720" y="42" fill="#38BDF8" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="end">Xem chi tiết ôn tập ❯</text>
    </g>
  </g>
</svg>
