<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <filter id="modalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="-4" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Base (Darkened Video) -->
  <rect width="390" height="844" fill="#0A0F1D"/>
  <rect width="390" height="844" fill="#000000" fill-opacity="0.65"/>

  <!-- Bottom Sheet Modal Container -->
  <g id="AddShortModal" transform="translate(0, 520)" filter="url(#modalShadow)">
    <path d="M0 26 C0 11.6, 11.6 0, 26 0 L364 0 C378.4 0, 390 11.6, 390 26 L390 324 L0 324 Z" fill="#0F172A" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>

    <!-- Drag Handle -->
    <rect x="176" y="12" width="38" height="4" rx="2" fill="#475569"/>

    <!-- Modal Title -->
    <text x="24" y="52" fill="#F8FAFC" font-family="sans-serif" font-size="22" font-weight="800">Học từ một Short</text>

    <!-- Modal Description -->
    <text x="24" y="80" fill="#94A3B8" font-family="sans-serif" font-size="13" font-weight="400">
      Dán liên kết YouTube Shorts, video YouTube hoặc mã video
    </text>
    <text x="24" y="98" fill="#94A3B8" font-family="sans-serif" font-size="13" font-weight="400">
      để mở ngay trong chế độ học.
    </text>

    <!-- URL Input Field -->
    <g transform="translate(24, 122)">
      <rect width="342" height="52" rx="12" fill="#1E293B" stroke="rgba(148, 163, 184, 0.35)" stroke-width="1"/>
      <text x="16" y="32" fill="#64748B" font-family="sans-serif" font-size="14">https://youtube.com/shorts/...</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(24, 198)">
      <!-- Cancel Button -->
      <rect width="140" height="48" rx="12" fill="transparent" stroke="#475569" stroke-width="1"/>
      <text x="70" y="30" fill="#CBD5E1" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">Hủy</text>

      <!-- Open Short Button -->
      <rect x="156" width="186" height="48" rx="12" fill="#38BDF8"/>
      <text x="249" y="30" fill="#082F49" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">Mở Short</text>
    </g>

    <!-- Home Indicator -->
    <rect x="145" y="304" width="100" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.3"/>
  </g>
</svg>
