<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Base (Clean Minimalist Theme) -->
  <rect width="390" height="844" fill="#F8FAFC"/>

  <!-- Status Bar (Dark text on light bg) -->
  <g id="StatusBar">
    <text x="24" y="32" fill="#0F172A" font-family="-apple-system, Roboto, sans-serif" font-size="13" font-weight="600">1:32</text>
    <g transform="translate(320, 20)">
      <path d="M0 12 L4 12 L4 8 L8 8 L8 4 L12 4 L12 0 L16 0 L16 12 Z" fill="#0F172A"/>
      <path d="M22 2 A12 12 0 0 1 34 2 M24 6 A8 8 0 0 1 32 6 M27 10 A3 3 0 0 1 29 10" stroke="#0F172A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <rect x="42" y="2" width="18" height="10" rx="2" fill="none" stroke="#0F172A" stroke-width="1.5"/>
      <rect x="44" y="4" width="12" height="6" rx="1" fill="#0F172A"/>
      <rect x="61" y="5" width="2" height="4" rx="0.5" fill="#0F172A"/>
    </g>
  </g>

  <!-- Header Section -->
  <g id="Header" transform="translate(20, 52)">
    <text x="0" y="24" fill="#0F172A" font-family="sans-serif" font-size="26" font-weight="800">Saved items</text>
    <text x="0" y="46" fill="#64748B" font-family="sans-serif" font-size="13" font-weight="500">Từ và câu bạn đã lưu từ video</text>
    <!-- Settings button -->
    <circle cx="330" cy="24" r="18" fill="#E2E8F0"/>
    <text x="330" y="30" fill="#475569" font-family="sans-serif" font-size="16" text-anchor="middle">⚙️</text>
  </g>

  <!-- Sub Header Tabs: Saved words / Phrases / Review button -->
  <g id="SubTabs" transform="translate(20, 118)">
    <!-- Saved words tab (active) -->
    <text x="0" y="16" fill="#4F46E5" font-family="sans-serif" font-size="15" font-weight="800">Saved words 3</text>
    <rect x="0" y="24" width="96" height="3" fill="#4F46E5" rx="1.5"/>

    <!-- Phrases tab -->
    <text x="120" y="16" fill="#64748B" font-family="sans-serif" font-size="15" font-weight="600">Phrases</text>

    <!-- Ôn 1 Button (FSRS Quick review) -->
    <rect x="290" y="-3" width="60" height="28" rx="8" fill="#6366F1"/>
    <text x="320" y="15" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Ôn 1</text>
  </g>

  <!-- Filter Chips -->
  <g id="FilterChips" transform="translate(20, 162)">
    <!-- Tất cả -->
    <rect x="0" y="0" width="56" height="28" rx="8" fill="#4F46E5"/>
    <text x="28" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Tất cả</text>

    <!-- Cần ôn -->
    <rect x="66" y="0" width="64" height="28" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="98" y="18" fill="#475569" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cần ôn</text>

    <!-- Đang học -->
    <rect x="140" y="0" width="76" height="28" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="178" y="18" fill="#475569" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Đang học</text>
  </g>

  <!-- Search Input Bar -->
  <g id="SearchBar" transform="translate(20, 204)">
    <rect width="350" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="16" y="24" fill="#94A3B8" font-family="sans-serif" font-size="14">🔍  Search</text>
  </g>

  <!-- SRS Suggestion Banner -->
  <g id="SuggestionBanner" transform="translate(20, 256)">
    <rect width="350" height="34" rx="8" fill="#F5F3FF" stroke="#E0E7FF" stroke-width="1"/>
    <text x="12" y="21" fill="#4338CA" font-family="sans-serif" font-size="11" font-weight="600">
      <tspan font-weight="800">GỢI Ý:</tspan> Ôn 1 thẻ đến hạn trước để giữ nhịp ghi nhớ ổn định.
    </text>
  </g>

  <!-- Table Column Headers -->
  <g id="TableHeaders" transform="translate(20, 308)">
    <text x="0" y="0" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="800" letter-spacing="1">ITEM</text>
    <text x="240" y="0" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="800" letter-spacing="1">STAGE</text>
    <text x="310" y="0" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="800" letter-spacing="1">SOURCE</text>
    <line x1="0" y1="10" x2="350" y2="10" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- Vocabulary Item Rows -->
  <g id="VocabList" transform="translate(20, 332)">
    <!-- Row 1: meticulous -->
    <g transform="translate(0, 0)">
      <rect x="0" y="6" width="20" height="20" rx="5" fill="#3B82F6"/>
      <text x="10" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">w</text>

      <text x="30" y="22" fill="#0F172A" font-family="sans-serif" font-size="15" font-weight="800">meticulous</text>
      <text x="114" y="22" fill="#94A3B8" font-family="sans-serif" font-size="12" font-style="italic">/məˈtɪkjələs/</text>
      <text x="30" y="42" fill="#475569" font-family="sans-serif" font-size="13">tỉ mỉ, cẩn thận đến từng chi tiết</text>
      <text x="30" y="60" fill="#64748B" font-family="sans-serif" font-size="11">She is <tspan fill="#3B82F6" font-weight="700">meticulous</tspan> about every detail.</text>

      <!-- Stage Badge: Ôn lại -->
      <rect x="236" y="8" width="46" height="20" rx="5" fill="#FEF3C7"/>
      <text x="259" y="22" fill="#D97706" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Ôn lại</text>

      <!-- Source & Play -->
      <text x="345" y="20" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="end">0:12</text>
      <rect x="325" y="28" width="26" height="26" rx="7" fill="#818CF8"/>
      <polygon points="334,36 342,41 334,46" fill="#FFFFFF"/>

      <line x1="0" y1="78" x2="350" y2="78" stroke="#F1F5F9" stroke-width="1"/>
    </g>

    <!-- Row 2: glimpse -->
    <g transform="translate(0, 92)">
      <rect x="0" y="6" width="20" height="20" rx="5" fill="#3B82F6"/>
      <text x="10" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">w</text>

      <text x="30" y="22" fill="#0F172A" font-family="sans-serif" font-size="15" font-weight="800">glimpse</text>
      <text x="96" y="22" fill="#94A3B8" font-family="sans-serif" font-size="12" font-style="italic">/ɡlɪmps/</text>
      <text x="30" y="42" fill="#475569" font-family="sans-serif" font-size="13">cái nhìn thoáng qua</text>
      <text x="30" y="60" fill="#64748B" font-family="sans-serif" font-size="11">I caught a <tspan fill="#3B82F6" font-weight="700">glimpse</tspan> of the city.</text>

      <!-- Stage Badge: Đang học -->
      <rect x="230" y="8" width="56" height="20" rx="5" fill="#DCFCE7"/>
      <text x="258" y="22" fill="#15803D" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Đang học</text>

      <!-- Source & Play -->
      <text x="345" y="20" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="end">0:28</text>
      <rect x="325" y="28" width="26" height="26" rx="7" fill="#818CF8"/>
      <polygon points="334,36 342,41 334,46" fill="#FFFFFF"/>

      <line x1="0" y1="78" x2="350" y2="78" stroke="#F1F5F9" stroke-width="1"/>
    </g>

    <!-- Row 3: resilient -->
    <g transform="translate(0, 184)">
      <rect x="0" y="6" width="20" height="20" rx="5" fill="#3B82F6"/>
      <text x="10" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">w</text>

      <text x="30" y="22" fill="#0F172A" font-family="sans-serif" font-size="15" font-weight="800">resilient</text>
      <text x="96" y="22" fill="#94A3B8" font-family="sans-serif" font-size="12" font-style="italic">/rɪˈzɪl.jənt/</text>
      <text x="30" y="42" fill="#475569" font-family="sans-serif" font-size="13">kiên cường, khả năng phục hồi</text>
      <text x="30" y="60" fill="#64748B" font-family="sans-serif" font-size="11">Children can be remarkably <tspan fill="#3B82F6" font-weight="700">resilient</tspan>.</text>

      <!-- Stage Badge: Đã học -->
      <rect x="236" y="8" width="46" height="20" rx="5" fill="#F1F5F9"/>
      <text x="259" y="22" fill="#475569" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Đã học</text>

      <!-- Source & Play -->
      <text x="345" y="20" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="end">0:43</text>
      <rect x="325" y="28" width="26" height="26" rx="7" fill="#818CF8"/>
      <polygon points="334,36 342,41 334,46" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Bottom Navigation Bar (Light mode variant) -->
  <g id="BottomNav" transform="translate(0, 772)">
    <rect width="390" height="72" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Tab 1 -->
    <g transform="translate(20, 10)">
      <text x="55" y="22" font-size="20" text-anchor="middle">🎬</text>
      <text x="55" y="42" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Shorts</text>
    </g>

    <!-- Tab 2 (Active) -->
    <g transform="translate(140, 10)">
      <text x="55" y="22" font-size="20" text-anchor="middle">🔖</text>
      <circle cx="68" cy="10" r="7" fill="#EF4444"/>
      <text x="68" y="14" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="900" text-anchor="middle">1</text>
      <text x="55" y="42" fill="#2563EB" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">Đã lưu</text>
    </g>

    <!-- Tab 3 -->
    <g transform="translate(260, 10)">
      <text x="55" y="22" font-size="20" text-anchor="middle">👤</text>
      <text x="55" y="42" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Tài khoản</text>
    </g>
  </g>
</svg>
