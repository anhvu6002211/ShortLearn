// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// CMake shortens clang++.exe to CLANG_~1.EXE when the Windows SDK path
// contains spaces. Clang then behaves like the C driver and omits libc++.
// Apply the explicit runtime link to every native Android module, including
// Expo modules and React Native codegen dependencies.
subprojects { subproject ->
  afterEvaluate {
    def androidExtension = subproject.extensions.findByName("android")
    if (androidExtension != null) {
      androidExtension.defaultConfig.externalNativeBuild.cmake.arguments(
        "-DCMAKE_CXX_STANDARD_LIBRARIES=-latomic -lm -lc++"
      )
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
