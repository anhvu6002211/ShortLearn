<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="ribbonFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38BDF8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Central Mark: Abstract Letter 'S' composed of Play-ribbon & Language Subtitle Geometry -->
  <g id="ShortLearn-Logo-Mark" transform="translate(192, 192)" filter="url(#glow)">
    <!-- Upper loop of 'S' - Top dynamic Play chevron curving into subtitle wave -->
    <path d="M 120 180 C 120 105 180 50 260 50 L 440 50 C 510 50 560 100 560 165 C 560 230 500 280 430 280 L 260 280 C 230 280 205 305 205 335 C 205 365 230 390 260 390 L 450 390 C 530 390 590 445 590 525 C 590 605 525 660 445 660 L 250 660 C 170 660 115 605 115 535"
          fill="none"
          stroke="url(#ribbonFlow)"
          stroke-width="72"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Dynamic Play symbol angle embedded inside the central flow -->
    <path d="M 285 190 L 380 245 L 285 300 Z" fill="#38BDF8" opacity="0.9"/>

    <!-- Subtle Speech / Subtitle accent dot / indicator communicating language reactor -->
    <rect x="420" y="490" width="90" height="26" rx="13" fill="#A78BFA"/>
    <rect x="290" y="490" width="105" height="26" rx="13" fill="#38BDF8"/>
  </g>
</svg>
