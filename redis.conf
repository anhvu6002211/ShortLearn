# Redis Configuration — ShortLearn Production
# V2: Eviction policy bảo vệ VPS RAM nhỏ (1-2GB)

# Giới hạn bộ nhớ Redis tối đa 256MB
# Trên VPS 1GB RAM: đặt 256mb
# Trên VPS 2GB RAM: có thể tăng lên 512mb
maxmemory 256mb

# Chính sách trục xuất: allkeys-lru
# Khi đầy RAM, Redis tự động xóa key ÍT được truy cập nhất (Least Recently Used)
# bất kể key đó có TTL hay không. Ưu tiên giữ lại video trending được tra cứu nhiều.
maxmemory-policy allkeys-lru

# Bật RDB snapshot cho persistence cơ bản
save 900 1
save 300 10
save 60 10000

# AOF persistence (tùy chọn, bật nếu cần data safety cao)
# appendonly yes
# appendfsync everysec
